[project]
name = "gait-imu"
version = "0.1.0"
description = "IMU-based gait analysis"
requires-python = ">=3.12"
# numpy 是首个运行时依赖。契约 §3 的 FootSeries / NavResult 以 np.ndarray
# 为字段类型，绕不开；ESKF、INS、步态分析后续也全部建立在它之上。
dependencies = [
    "numpy>=2.1",
    # 硬件接口层不在本仓库重复实现：0x55 帧解析、FF AA 指令封装、寄存器表、
    # BLE 扫描/连接/重连、多设备合流、电量遥测与回放传输都由 wt901 提供，
    # 它的范围外声明（不做姿态融合/步态分析/持久化/时钟同步算法）与本仓库互补。
    #
    # 来源见下方 [tool.uv.sources]。这里只写普通包名，不写 direct reference：
    # direct reference 会被烘进构建出的 wheel 元数据，拿到 wheel 的人就得到一个
    # 改不掉的 git URL，很多索引还直接拒收。[tool.uv.sources] 是解析期的来源
    # 声明，不进 wheel。
    "wt901",
]

[tool.uv.sources]
# wt901 未发布到 PyPI、无 tag、无 release，因此按 commit 钉住。
#
# 钉 commit 而不是分支：分支引用会让"同一份 uv.lock"在不同时刻装出不同的代码，
# 而锁文件的全部意义就是排除这种可能。换版本 = 改这里的 rev + 重新 uv lock，
# 是一次显式的、会进 diff 的动作。
#
# ad98ceab = WT901#19 "RAY-291 [mounting] 安装方向（0x23）纳入具名配置"。
# 相对上一钉（9ccb834c）带进三件，都是本仓库开的上游 Issue：
#
#   RAY-279  Telemetry.read_mac() / DeviceInfo.mac / Register.MAC
#            —— 可跨主机持久化的设备身份，RAY-196 的绑定键等的就是它。
#   RAY-280  read_recording(..., tolerate_truncated_tail=True) / Recording.truncated
#            —— 崩溃截断的录制不再整份失效，RAY-198 的 crash-recovery 等的是它。
#   RAY-291  Mounting / Settings.mounting / set_mounting / read_mounting
#            —— 本 scope 用的就是这一件，补上配置序列的第 ⑥ 步。
wt901 = { git = "https://github.com/RGu0/WT901.git", rev = "ad98ceab981503a9b82ac6881b09cae64d96842d" }

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gait"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# tools/ 不是包，也不该是 —— 它是仓库自己的检查脚本，不随 wheel 发布。
# 让 pytest 把它加进 sys.path，好过在测试文件里手改 sys.path：后者会把
# import 挤到文件中部，引出一串 noqa，而那些 noqa 在 ruff 默认规则集下
# 又是“无用的 noqa”。
pythonpath = ["tools"]
