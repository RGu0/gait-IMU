[project]
name = "gait-imu"
version = "0.1.0"
description = "IMU-based gait analysis"
requires-python = ">=3.12"
# numpy 是首个运行时依赖。契约 §3 的 FootSeries / NavResult 以 np.ndarray
# 为字段类型，绕不开；ESKF、INS、步态分析后续也全部建立在它之上。
dependencies = [
    "numpy>=2.1",
    # 硬件接口层不在本仓库重复实现：0x55 帧解析、FF AA 指令封装、寄存器表、
    # BLE 扫描/连接/重连、多设备合流、电量遥测与回放传输都由 wt901 提供，
    # 它的范围外声明（不做姿态融合/步态分析/持久化/时钟同步算法）与本仓库互补。
    #
    # 来源见下方 [tool.uv.sources]。这里只写普通包名，不写 direct reference：
    # direct reference 会被烘进构建出的 wheel 元数据，拿到 wheel 的人就得到一个
    # 改不掉的 git URL，很多索引还直接拒收。[tool.uv.sources] 是解析期的来源
    # 声明，不进 wheel。
    "wt901",
]

[tool.uv.sources]
# wt901 未发布到 PyPI、无 tag、无 release，因此按 commit 钉住。
#
# 钉 commit 而不是分支：分支引用会让"同一份 uv.lock"在不同时刻装出不同的代码，
# 而锁文件的全部意义就是排除这种可能。换版本 = 改这里的 rev + 重新 uv lock，
# 是一次显式的、会进 diff 的动作。
#
# cb88cee5 = WT901#20 "RAY-293 [zero-serial] 全零序列号不再伪装成空字符串"。
# 相对上一钉（ad98ceab）只带一件：
#
#   RAY-293  新增 SerialNumber（raw / value / is_plausible）；read_serial_number
#            由返回 str 改为返回它，全零回读的 value 是 None 而不是 ""；
#            DeviceInfo 新增 serial_number_raw 区分「没读到」与「读到了但全零」。
#
# 这是一次破坏性变更，但**本仓库没有调用点**：升级时对全部 .py 逐文件 grep
# read_serial_number / serial_number_raw / SerialNumber / DeviceInfo，命中为 0；
# 唯一的 telemetry 调用是 device/ble.py 的 read_battery()。身份绑定走的是
# RAY-279 的 read_mac()，不是序列号 —— device/binding.py 的模块文档已写明它只
# 消费注入的 DeviceIdentity，而 DeviceIdentity 本就拒空值。
#
# 那为什么还要升：上游那个全零读数在真机上出现过（两台主机、两台设备），旧行为
# 把它变成 ""，下游一旦拿它当绑定键就会让每台设备的键都相同 —— 一种不报错的
# 互相冒充。现在没人踩不等于将来没人踩，把已知会静默出错的读数留在依赖里没有
# 好处（RAY-329）。
wt901 = { git = "https://github.com/RGu0/WT901.git", rev = "cb88cee5dab014656bec638a9fdb69c3b17075cd" }

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gait"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# tools/ 不是包，也不该是 —— 它是仓库自己的检查脚本，不随 wheel 发布。
# 让 pytest 把它加进 sys.path，好过在测试文件里手改 sys.path：后者会把
# import 挤到文件中部，引出一串 noqa，而那些 noqa 在 ruff 默认规则集下
# 又是“无用的 noqa”。
pythonpath = ["tools"]
