[project]
name = "gait-imu"
version = "0.1.0"
description = "IMU-based gait analysis"
requires-python = ">=3.12"
# numpy 是首个运行时依赖。契约 §3 的 FootSeries / NavResult 以 np.ndarray
# 为字段类型，绕不开；ESKF、INS、步态分析后续也全部建立在它之上。
dependencies = [
    "numpy>=2.1",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gait"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# tools/ 不是包，也不该是 —— 它是仓库自己的检查脚本，不随 wheel 发布。
# 让 pytest 把它加进 sys.path，好过在测试文件里手改 sys.path：后者会把
# import 挤到文件中部，引出一串 noqa，而那些 noqa 在 ruff 默认规则集下
# 又是“无用的 noqa”。
pythonpath = ["tools"]
