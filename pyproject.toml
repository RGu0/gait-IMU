[project]
name = "gait-imu"
version = "0.1.0"
description = "IMU-based gait analysis"
requires-python = ">=3.12"
# numpy 是首个运行时依赖。契约 §3 的 FootSeries / NavResult 以 np.ndarray
# 为字段类型，绕不开；ESKF、INS、步态分析后续也全部建立在它之上。
dependencies = [
    "numpy>=2.1",
    # 硬件接口层不在本仓库重复实现：0x55 帧解析、FF AA 指令封装、寄存器表、
    # BLE 扫描/连接/重连、多设备合流、电量遥测与回放传输都由 wt901 提供，
    # 它的范围外声明（不做姿态融合/步态分析/持久化/时钟同步算法）与本仓库互补。
    #
    # 来源见下方 [tool.uv.sources]。这里只写普通包名，不写 direct reference：
    # direct reference 会被烘进构建出的 wheel 元数据，拿到 wheel 的人就得到一个
    # 改不掉的 git URL，很多索引还直接拒收。[tool.uv.sources] 是解析期的来源
    # 声明，不进 wheel。
    "wt901",
]

[tool.uv.sources]
# wt901 未发布到 PyPI。RAY-334 曾决定「按 tag 钉住」，理由是 tag 与 commit 一样
# 是不可变引用、还带着上游发布语义 —— 这个前提被上游破坏了一次（RAY-348）：
# 上游把 v0.3.0 从轻量 tag **重打为 annotated tag**，tag 自身的 SHA 从 80b03c9
# 变成 739518f（剥离后的 commit 仍是 80b03c9，代码一字未变），于是 uv 以 tag
# 的 SHA 作解析键，锁文件里记的 80b03c9 与新解析出的 739518f 对不上，被判过期。
#
# 结论修正为：**tag 是可被上游移动/重打的引用，commit 不是**。改回按 commit 钉住。
# 钉 commit 不钉分支：分支引用会让「同一份 uv.lock」在不同时刻装出不同的代码，而
# 锁文件的全部意义就是排除这种可能。commit 不可变，还正好等于 v0.3.0 的剥离
# commit —— 换版本 = 改这里的 rev + 重新 uv lock，是一次显式的、会进 diff 的动作。
#
# 80b03c9 = v0.3.0^{} = WT901#39。相对上一钉（cb88cee5，它本身还在 v0.2.0 之前）
# 带进 22 个合并，其中对本仓库要紧的：
#
#   RAY-292  0x71 回帧按 4 个寄存器解，协议固定回 8 个 —— 解码错误，不是缺功能。
#   RAY-306  重连后配置重放失败时整条重连语义静默失效：连上了、数据在流、设备
#            停在出厂 10 Hz，而应用以为是自己配的速率，没有任何一处报错。
#   RAY-305  芯片时间 / 四元数 / 版本号在寄存器全零时交出看着正常的假值。
#   RAY-311  连接就绪之前到达的帧不再交付，计入新增的
#            DeviceStats.dropped_before_ready；它**没有**并进 dropped_samples。
#            device/capture.py 与 cli/linktest.py 的可信性判据已一并接入它。
#
# 两条破坏性变更（read_version() 全零改抛、ChipTime.__str__ 不再打成时间戳样式）
# 在本仓库均零命中。「Battery.percent 可能为 None」上游列在升级须知里，但对本
# 仓库**不是本次变化** —— battery_percent 在 cb88cee 与 v0.3.0 之间逐字节相同，
# device/orchestration.py 早已显式处理 None。
wt901 = { git = "https://github.com/RGu0/WT901.git", rev = "80b03c9ede1b54cd9d8582ba867cd00c465d1c44" }

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gait"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# tools/ 不是包，也不该是 —— 它是仓库自己的检查脚本，不随 wheel 发布。
# 让 pytest 把它加进 sys.path，好过在测试文件里手改 sys.path：后者会把
# import 挤到文件中部，引出一串 noqa，而那些 noqa 在 ruff 默认规则集下
# 又是“无用的 noqa”。
pythonpath = ["tools"]
