name: Preview release

# 冻结 sidecar + 打 Electron 安装包（RAY-250 preview-installers，服务 RAY-493 Preview）。
# **只出构件，不发布** —— 没有 release、没有签名、没有公证。
#
# pull_request 只在打包相关文件变动时触发：一次完整冻结 + 双平台打包要几分钟，
# 不该压在每个 PR 上；而改打包方案的 PR 必须看到它的结论。
on:
  workflow_dispatch:
  push:
    tags: ["preview-*"]
  pull_request:
    paths:
      - "packaging/**"
      - ".github/workflows/preview-release.yml"
      - "apps/terminal/main/electron-builder.yml"

concurrency:
  group: preview-release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # 与 packaging/README.md 同一个 pin；升版两处一起改。
  PYINSTALLER_VERSION: "6.22.3"
  PYTHONUTF8: "1"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            sidecar_exe: dist/gait-sidecar/gait-sidecar
          - os: windows-latest
            sidecar_exe: dist/gait-sidecar/gait-sidecar.exe
    runs-on: ${{ matrix.os }}
    steps:
      # 工具链设置与 ci.yml 一致（同样的 action pin，同样读 .node-version / packageManager /
      # .python-version），理由见那里。
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .node-version

      - uses: pnpm/action-setup@v6.0.10
        with:
          cache: true

      - uses: astral-sh/setup-uv@v10.0.1

      - name: setup（macOS）
        if: runner.os != 'Windows'
        run: ./dev setup

      - name: setup（Windows）
        if: runner.os == 'Windows'
        run: pwsh -File dev.ps1 setup

      - name: 冻结 sidecar（PyInstaller）
        shell: bash
        run: |
          uv run --locked --with "pyinstaller==${PYINSTALLER_VERSION}" \
            pyinstaller packaging/gait-sidecar.spec \
            --distpath dist --workpath build/pyinstaller --noconfirm
          du -sh dist/gait-sidecar

      - name: 冒烟 1 —— GAIT_SELFTEST=imports
        shell: bash
        env:
          GAIT_SELFTEST: imports
        run: ${{ matrix.sidecar_exe }}

      - name: 冒烟 2 —— describe / snapshot 往返
        shell: bash
        run: uv run --locked python packaging/smoke_sidecar.py "${{ matrix.sidecar_exe }}"

      - name: 打包 sidecar 构件（macOS，保留可执行位）
        if: runner.os != 'Windows'
        run: ditto -c -k --keepParent dist/gait-sidecar "dist/gait-sidecar-${{ runner.os }}.zip"

      - name: 打包 sidecar 构件（Windows）
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist/gait-sidecar -DestinationPath "dist/gait-sidecar-${{ runner.os }}.zip"

      - uses: actions/upload-artifact@v7.0.1
        with:
          name: gait-sidecar-${{ runner.os }}
          path: dist/gait-sidecar-${{ runner.os }}.zip
          if-no-files-found: error

      - name: 构建渲染进程
        run: pnpm --filter @gait/terminal-renderer build

      # electron / electron-builder 依赖与 preload.cjs 由 RAY-493 electron-shell-boot 引入（已合入）。
      # 守卫保留：它让「Electron 外壳不在」表现为跳过而不是一条看不懂的 electron-builder 报错。
      - name: electron-builder
        if: hashFiles('apps/terminal/main/preload.cjs') != ''
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: pnpm --filter @gait/terminal-main exec electron-builder --config electron-builder.yml --publish never

      # 真实启动一次未安装的应用：验 asar 里的渲染端、extraResources 里的 sidecar、主进程替换出的
      # 环境三者接得上。只验构件冒烟证明不了这些。
      - name: 冒烟 3 —— 启动打包后的应用
        if: hashFiles('apps/terminal/main/preload.cjs') != ''
        shell: bash
        run: uv run --locked python packaging/smoke_app.py apps/terminal/main/release

      - uses: actions/upload-artifact@v7.0.1
        if: hashFiles('apps/terminal/main/preload.cjs') != ''
        with:
          name: installer-${{ runner.os }}
          path: |
            apps/terminal/main/release/*.dmg
            apps/terminal/main/release/*.zip
            apps/terminal/main/release/*.exe
          if-no-files-found: error

  # A5-win（RAY-493 windows-ci-acceptance）：把刚打出的 NSIS 包真的装上，用**安装后的** exe
  # 跑演示模式端到端 —— A1 走满出报告、A2 停止/记录/强杀 sidecar 后恢复、A3 落盘 meta、
  # 1280×720 不溢出、全程无控制台窗口、退出无残留。驱动与 macOS 装机验收是同一个脚本。
  acceptance-windows:
    needs: build
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .node-version

      - uses: actions/download-artifact@v8.0.1
        with:
          name: installer-Windows
          path: installer

      - name: 静默安装（NSIS /S，按用户安装）
        shell: pwsh
        run: |
          $setup = Get-ChildItem installer -Filter "*Setup*.exe" | Select-Object -First 1
          if (-not $setup) { throw "installer-Windows 构件里没有安装程序" }
          $proc = Start-Process $setup.FullName -ArgumentList "/S" -Wait -PassThru
          if ($proc.ExitCode -ne 0) { throw "安装程序退出码 $($proc.ExitCode)" }
          $exe = Get-ChildItem "$env:LOCALAPPDATA\Programs" -Recurse -Filter "GaitIMU Preview.exe" | Select-Object -First 1
          if (-not $exe) { throw "安装后在 $env:LOCALAPPDATA\Programs 下找不到 GaitIMU Preview.exe" }
          Get-ItemProperty HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\* |
            Where-Object DisplayName -like "GaitIMU*" |
            Format-List DisplayName, DisplayVersion, InstallLocation
          "A5_APP=$($exe.FullName)" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: 演示模式端到端（安装后的应用）
        env:
          A5_OUT: ${{ runner.temp }}/acceptance-windows
        run: node packaging/acceptance/preview_acceptance.mjs

      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: acceptance-Windows
          path: ${{ runner.temp }}/acceptance-windows
          if-no-files-found: warn
